# The bundle's own Loader patch, applied after dsh-base and dsh-web-app.
#
# One row mounts this package. It replaces nothing: the official `web_search`
# tool stays mounted and stays visible to subagents. This plugin adds the two
# delegation routes, a guard that refuses a direct `web_search` outside a
# delegation, a reading budget every delegated child has to respect, and a guard
#
# The plugin never chooses a search backend itself — the search provider is
# whatever the profile already pins.

- insert:
    - id: delegation-policy
      name: '@zyn19940107/dsh-delegation-policy'
      config:
        searchProvider: spawn
        maxSources: 5
        maxSnippetChars: 400
        maxChildCalls: 3
        searchTimeoutMs: 600000
        thinkProvider: fork
        maxThinkCalls: 5
        thinkTimeoutMs: 900000
        verifyRounds: 2
        verifyProvider: spawn
        verifyTimeoutMs: 600000
        retrieveFirst: true
        retrieveMaxChildCalls: 3
        oscillationThreshold: 12
        oscillationAction: observe
        conflictSearchCalls: 2
